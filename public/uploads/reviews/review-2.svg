  <rect x="36" y="280" width="820" height="150" rx="26" fill="#FFFFFF"/>
  <text x="66" y="342" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#111B21">The fabric is so substantial, and the loose cut</text>
  <text x="66" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#111B21">is exactly what I was looking for</text>
  <text x="805" y="414" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#667781">6:03 PM</text>
  <!-- Incoming bubble 3 -->
  <rect x="36" y="460" width="760" height="100" rx="26" fill="#FFFFFF"/>
  <text x="66" y="522" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#111B21">Ordering the plum one for the engagement 🤍</text>
  <text x="745" y="544" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#667781">6:03 PM</text>
