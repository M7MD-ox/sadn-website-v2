  <polyline points="1478,746 1490,752 1478,758" fill="none" stroke="#53BDEB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1492,746 1504,752 1492,758" fill="none" stroke="#53BDEB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
